<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello todos</title>
</head>
<body>
    <div class="header">
            <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <rect width="120" height="120" rx="24" fill="#4F46E5"/>
            <rect x="30" y="34" width="60" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
            <rect x="30" y="56" width="60" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
            <rect x="30" y="78" width="40" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
            <circle cx="90" cy="82" r="18" fill="#22C55E"/>
            <path d="M82 82 L88 88 L98 76" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="header-title">
        <h3>Hello todo</h3>
    </div>
    </div>
    <div class="sidebar">
        <button class = "project-button"> + New Project</button>
        <div class="projects"></div>
    </div>
    <div class="list-container">
        <div class="top">
            <button class="todo-button"> + New Todo</button>
            <div class="sort-buttons">
                <select name="sorting" id="sorting">
                    <option value="default">Default</option>
                    <option value="priority">By Priority</option>
                    <option value="date">By Date</option>
                </select>
                <button type="button" id = "sort-apply">Apply</button>
            </div>
        </div>
        <div class="todos"></div>
    </div>
    <dialog class = "todo-dialog">
        <form action="">

            <div class="title">
                <label for="title">Title</label>
                <input type="text" id="title">
            </div>

            <div class="description">
                <label for="description">Description</label>
                <textarea id="description"></textarea>
            </div>

            <div>
                <label for="deadline">Deadline:</label>
                <input type="datetime-local" id="deadline">
            </div>

            <div>
                <label for="priority">Priority:</label>
                <select name="priority" id="priority">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <button class="todo-save" type="button">Save Todo</button>

        </form>
    </dialog>
    <dialog class="project-dialog">
        <form action="">
            <div>
                <label for="name">Name of project:</label>
                <input type="text" id="name">
            </div>
            <button class="project-save" type="button">Save Project</button>
        </form>
    </dialog>
</body>
</html>
